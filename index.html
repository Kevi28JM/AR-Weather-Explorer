<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Weather Explorer</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        font-family: 'Segoe UI', sans-serif;
        color: white;
        text-align: center;
        padding: 20px;

        /* Gradient background (swap for a real image below if you have one) */
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        background-size: cover;
        background-position: center;

        /* To use a background image instead, replace the line above with: */
        /* background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), url('background.jpg') center/cover no-repeat; */
      }

      .title-block {
        margin-bottom: 10px;
      }

      h1 {
        margin: 0;
        font-size: 2.2rem;
        letter-spacing: 0.5px;
        text-shadow: 0 2px 12px rgba(0,0,0,0.4);
      }

      p.subtitle {
        margin: 8px 0 0;
        font-size: 0.95rem;
        color: rgba(255,255,255,0.75);
      }

      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: min(90vw, 320px);
      }

      a.btn {
        padding: 18px 32px;
        border-radius: 14px;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.25);
        backdrop-filter: blur(8px);
        color: white;
        text-decoration: none;
        font-size: 18px;
        font-weight: 600;
        transition: background 0.25s ease, transform 0.15s ease;
      }
      a.btn:hover {
        background: rgba(255,255,255,0.22);
        transform: translateY(-2px);
      }
      a.btn:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <div class="title-block">
      <h1>🌍 AR Weather Explorer</h1>
      <p class="subtitle">Choose an experience to begin</p>
    </div>

    <div class="btn-group">
      <a class="btn" href="./marker-based/index.html">📍 Marker Based</a>
      <a class="btn" href="./markerless/index.html">🌐 Markerless</a>
    </div>

    <button id="credits-btn" style="
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(255,255,255,0.15);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 13px;
      cursor: pointer;
    ">ⓘ Credits</button>

    <div id="credits-panel" style="
      display: none;
      position: fixed;
      top: 60px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 16px 20px;
      border-radius: 10px;
      font-family: sans-serif;
      font-size: 13px;
      max-width: 280px;
      line-height: 1.7;
      text-align: left;
    ">
      <strong>3D Model Credits</strong><br /><br />

      <strong>Sun</strong> by Poly by Google
      [<a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" style="color:#90cdf4;">CC-BY</a>]
      via <a href="https://poly.pizza/m/77wHkzwlpOq" target="_blank" style="color:#90cdf4;">Poly Pizza</a>
      <br /><br />

      <strong>Low Poly Globe</strong> by Emmett "TawpShelf" Baber
      [<a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" style="color:#90cdf4;">CC-BY</a>]
      via <a href="https://poly.pizza/m/a7ZAkNc0F24" target="_blank" style="color:#90cdf4;">Poly Pizza</a>
      <br /><br />

      <strong>Lightning</strong> by Jason Toff
      [<a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" style="color:#90cdf4;">CC-BY</a>]
      via <a href="https://poly.pizza/m/1r7dFgxf8ti" target="_blank" style="color:#90cdf4;">Poly Pizza</a>
      <br /><br />

      <strong>Sound Effect</strong> by
      <a href="https://pixabay.com/users/soundreality-31074404/" target="_blank" style="color:#90cdf4;">Jurij</a>
      from <a href="https://pixabay.com/sound-effects/" target="_blank" style="color:#90cdf4;">Pixabay</a>
    </div>

    <script>
      document.getElementById('credits-btn').addEventListener('click', () => {
        const panel = document.getElementById('credits-panel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      });
    </script>
  </body>
</html>
