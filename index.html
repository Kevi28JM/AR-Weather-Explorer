<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Weather Explorer - Marker Part</title>

    <!-- A-Frame: the 3D engine. Gives us <a-scene>, <a-entity>, <a-camera>. -->
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

    <!-- MindAR: the image tracking. Finds your marker in the camera feed -->
    <!-- and works out where it is in 3D space, every frame.              -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- Kill the default page margin so the camera fills the screen. -->
    <style>
      body { margin: 0; }
      #label {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.6);
        color: white;
        padding: 8px 16px;
        border-radius: 8px;
        font-family: sans-serif;
        font-size: 14px;
        z-index: 999;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <!-- Simple on-screen instruction label, separate from the 3D scene -->
    <div id="label">AR Weather Explorer - point camera at your marker image</div>

    <!-- ================================================================
         THE SCENE
         imageTargetSrc points at YOUR compiled marker file. This name
         must match the file in your folder EXACTLY, capitals included.
         ================================================================ -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <!-- Load the 3D model up front, before the scene starts running. -->
      <a-assets>
        <a-asset-item id="myModel" src="./model.glb"></a-asset-item>
      </a-assets>

      <!-- The AR camera. Leave this alone - MindAR drives it for you. -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- ==============================================================
           WHAT APPEARS ON THE MARKER
           Anything inside this entity is hidden until the marker is seen,
           then it sticks to it. targetIndex: 0 = the first (only) image
           inside targets.mind.
           ============================================================== -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- YOUR MODEL. Same three tunable lines as the lab:
               position = "x y z"
               scale    = "x y z"
               rotation = "x y z" (glTF models often need x=90 to lie flat) -->
        <a-gltf-model
          src="#myModel"
          position="0 0 0.1"
          scale="0.02 0.02 0.02"
          rotation="90 0 0"
        ></a-gltf-model>

        <!-- Simple floating text label above the model, so the marker
             experience clearly shows "this is a place/object", not just
             a bare model. Tune position (3rd number = height) to sit it
             above your model. -->
        <a-text
          value="Weather Point"
          position="0 0.5 0"
          align="center"
          color="#FFFFFF"
          width="2"
        ></a-text>

      </a-entity>
    </a-scene>
  </body>
</html>
